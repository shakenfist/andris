[package]
name = "andris"
description = "A SPICE server that exports an existing X11 desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# For O_NONBLOCK, and memfd_create and file seals for the MIT-SHM capture
# segment; already in the tree through tokio.
libc = "0.2"
# Maps the MIT-SHM capture segment, a memfd shared with the X server, so
# andris does not hand-roll mmap and munmap.
memmap2 = "0.9"
# 0.8, the version shakenfist-spice-protocol uses, so that only one rand
# is built.
rand = "0.10"
# 2.6, the version rsa and rustls already pull in.
subtle = "2.6"
tokio = { version = "1", features = ["full"] }
# 0.26, the version shakenfist-spice-protocol uses, so that only one
# rustls is built.
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.14", features = ["damage", "randr", "shm", "xfixes", "xkb", "xtest"] }

# ryll's shared crates, pinned to 1858569, the head of ryll#534 (headless
# clipboard and resize verbs), which `make e2e` needs. This rev lives only
# on that pull request's branch: it is temporary, and moves to ryll#534's
# merge commit on develop once that merges.
# Both crates come from one ryll workspace, so they must always carry the
# same rev, here and in [dev-dependencies]; move them together.
shakenfist-spice-protocol = { version = "0.1.7", git = "https://github.com/shakenfist/ryll", rev = "1858569780db05145bdf849b2fbabd30b6addc07" }
# Only the encoders. openh264 is still built, because the crate depends on
# it unconditionally (ryll#499).
shakenfist-spice-compression = { version = "0.1.7", git = "https://github.com/shakenfist/ryll", rev = "1858569780db05145bdf849b2fbabd30b6addc07", default-features = false, features = [
    "encode",
] }

[dev-dependencies]
rcgen = "0.14"
# The LZ4 and pure-Rust JPEG decoders too, so tests can decode what the
# encoders produced. Cargo unifies these features with the ones above in
# test builds.
shakenfist-spice-compression = { version = "0.1.7", git = "https://github.com/shakenfist/ryll", rev = "1858569780db05145bdf849b2fbabd30b6addc07", default-features = false, features = [
    "encode",
    "jpeg",
    "lz4",
] }
tempfile = "3"
# X-Resource, so the X11 test can find andris's MIT-SHM segment as another
# client of the display would, and detach it. Cargo unifies these features
# with the ones above in test builds.
x11rb = { version = "0.14", features = ["res"] }
