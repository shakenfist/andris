# cargo-deny policy for andris.
#
# Update the license allowlist below when a new permissive licence is
# pulled in by a dependency. Only add `[[licenses.exceptions]]` entries
# after confirming that the non-standard license is safe for our
# redistribution use.
#
# The advisories ignore list tracks known issues we have explicitly
# accepted. Every entry must have a URL and a rationale. There are
# currently none.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "bzip2-1.0.6",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Intra-workspace path dependencies without a version register as
# wildcard deps. Allow them explicitly; real wildcard deps on external
# crates would still be flagged because they would appear in the
# lockfile as such.
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Phase 3 may pin ryll by git revision.
allow-git = ["https://github.com/shakenfist/ryll"]
