# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# The include list is explicit paths first, then globs. The explicit
# paths are the files docs/reading-guide.md describes, in the order it
# describes them, and `order = 'listed'` makes `next` offer files in
# include order. The globs after them catch everything a person wrote
# that the guide does not name: a file added later lands under a glob
# at the end of the queue, so scope stays complete, and a renamed file
# falls to the same globs, so a stale explicit path costs only its
# position. Keep the explicit paths in step with the guide's headings.
#
# Rust, shell and Python are the executable artifacts, tests included:
# much of andris's behaviour is pinned only by its tests, and
# #[cfg(test)] modules cannot be separated from the files they sit in.
# The YAML is executable in practice (the CI workflows decide what
# runs, with which permissions, against which secrets), and the
# Markdown documentation is included because docs drift out of sync
# just as quietly as code. TOML and JSON are the configuration that
# decides what the code is built from and what is allowed into it:
# manifests name every dependency, deny.toml and renovate.json decide
# which advisories and updates are tolerated. The systemd unit decides
# the privileges the daemon runs with, the Dockerfiles and the
# Makefile are the build entry points, and .gitignore is included
# because what it hides is a security property. .devcontainer/ is
# included by directory, since it is the build environment rather than
# a file type; its requirements.txt is reached by that glob, and a
# human chose the packages in it even though Renovate edits the hashes.
#
# The review tooling's own state files -- REVIEWS.md, this file, and
# the .vscode/<user>.weaudit pair -- are excluded by the helper itself
# (its BUILTIN_EXCLUDE is '.vscode/*' and REVIEWS.md) and are
# deliberately not repeated here. They cannot attest to themselves.
#
# The excludes are files whose content no human decides, or that are
# point-in-time records:
#
# - docs/plans/ holds plan files, which are records of intended work
#   rather than living artifacts, and would swamp the queue.
# - Cargo.lock is rewritten by cargo and by Renovate. The decisions in
#   it are made in the manifests, which are in scope.
# - LICENSE is verbatim upstream licence text.
# - .github/exported-config/ is a snapshot of this repository's GitHub
#   settings, written by the export workflow. It is a record of state
#   configured in the GitHub UI, not an input to anything.
# - evdev_names.rs and testdata/*.names are generated by
#   scripts/gen-evdev-names.py from xkeyboard-config's keycode files,
#   so a review mark on one would attest to the generator's output
#   rather than to anything a human wrote. The generator is in scope.
order = 'listed'
include = [
