[package]
name = "andris"
description = "A SPICE server that exports an existing X11 desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
# Encodes the random ticket `andris install-unit` writes. 0.23, the
# version rcgen already pulls in (through pem), with pem's features:
# none of the SIMD engines, which are the crate's only unsafe code.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
# For O_NONBLOCK, and memfd_create and file seals for the MIT-SHM capture
# segment; already in the tree through tokio.
libc = "0.2"
# Maps the MIT-SHM capture segment, a memfd shared with the X server, so
# andris does not hand-roll mmap and munmap.
memmap2 = "0.9"
# Loads libpulse at run time, for PulseAudio's simple API, which
# captures the desktop's sound from a sink's monitor (the protocol is
# served by PulseAudio and by PipeWire's pipewire-pulse alike). Andris
# does not link libpulse, so it starts without it, and serves without
# sound; the bindings are hand-written, in platform/pulse/ffi.rs. 0.9,
# the version shakenfist-spice-compression already pulls in, so that
# only one libloading is built.
libloading = "0.9"
# The playback channel's Opus encoder, as ryll's WebRTC bridge uses. It
# builds libopus statically from bundled source (through opusic-sys),
# with the cmake the image already has, so andris links no system
# libopus.
opus = "0.4"
# 0.10. shakenfist-spice-protocol (and rsa, through num-bigint-dig)
# still use 0.8, so two rands are built until they move.
rand = "0.10"
# 0.6, the version tokio already pulls in, for TCP_NOTSENT_LOWAT on the
# playback channel's socket (behind its `all` feature), which tokio does
# not expose.
socket2 = { version = "0.6", features = ["all"] }
# 2.6, the version rsa and rustls already pull in.
subtle = "2.6"
tokio = { version = "1", features = ["full"] }
# 0.26, the version shakenfist-spice-protocol uses, so that only one
# rustls is built.
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.14", features = ["damage", "randr", "shm", "xfixes", "xkb", "xtest"] }

# ryll's shared crates, pinned to 38c51ef, ryll#578's merge on develop,
# which adds the playback wire types (ryll 0.3.0 also has `H264Content`,
# which tunes the H.264 encoder for video). The
# encoder itself (in shakenfist-spice-compression, behind its `encode`
# feature) and the control-socket `stats` verb that `make e2e` needs came
# with ryll#552.
# Both crates come from one ryll workspace, so they must always carry the
# same rev, here and in [dev-dependencies]; move them together.
shakenfist-spice-protocol = { version = "0.3.0", git = "https://github.com/shakenfist/ryll", rev = "38c51eff3351795342b4ba283cf283b0eb2bab94" }
# Only the encoders. openh264 is also built, because the crate depends on
# it unconditionally (ryll#499), and is now used too, for the H.264 encoder.
shakenfist-spice-compression = { version = "0.3.0", git = "https://github.com/shakenfist/ryll", rev = "38c51eff3351795342b4ba283cf283b0eb2bab94", default-features = false, features = [
    "encode",
] }

[dev-dependencies]
# libpulse's own bindings, which link it, so that a test can check the
# hand-written constants and struct layouts in platform/pulse/ffi.rs
# against them. Tests only: the andris binary links no libpulse. 1.23,
# the version libpulse-binding used.
libpulse-sys = "1.23"
# Ryll's Opus decoder, so tests decode the playback channel's packets as
# ryll would, into a buffer of exactly one 10 ms frame.
opus-decoder = "0.1"
rcgen = "0.14"
# The paused clock (`test-util`), so the synthetic tone's pacing can be
# tested without waiting for it. Cargo unifies these features with the
# ones above in test builds.
tokio = { version = "1", features = ["full", "test-util"] }
# The LZ4 and pure-Rust JPEG decoders too, so tests can decode what the
# encoders produced. `jpeg` also gates the video stream decoders
# (`video::for_stream`), H.264's among them. Cargo unifies these features
# with the ones above in test builds only.
shakenfist-spice-compression = { version = "0.3.0", git = "https://github.com/shakenfist/ryll", rev = "38c51eff3351795342b4ba283cf283b0eb2bab94", default-features = false, features = [
    "encode",
    "jpeg",
    "lz4",
] }
tempfile = "3"
# X-Resource, so the X11 test can find andris's MIT-SHM segment as another
# client of the display would, and detach it. Cargo unifies these features
# with the ones above in test builds.
x11rb = { version = "0.14", features = ["res"] }
