repos:
  # rustfmt and clippy run in the andris-dev image via `make lint`.
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$|Cargo\.(toml|lock)$
      # The release workflow's version check, against fixtures.
      - id: release-version
        name: release-version.sh fixtures
        entry: ./tools/test-release-version.sh
        language: script
        pass_filenames: false
        files: ^tools/(test-)?release-version\.sh$

  # GitHub Actions workflow linter. The config declares the self-hosted
  # runner labels the workflows use.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.vscode/.*\.weaudit
      - id: end-of-file-fixer
        exclude: ^\.vscode/.*\.weaudit
      - id: check-yaml
        exclude: ^scripts/kerbside-lane/compose\.override\.yml$
      # A compose override's `!reset` tag is not one PyYAML can
      # construct, so that file is checked for syntax alone; `docker
      # compose config` checks the rest when the lane runs.
      - id: check-yaml
        name: check yaml (syntax only, for compose's tags)
        files: ^scripts/kerbside-lane/compose\.override\.yml$
        args: ['--unsafe']
      - id: check-merge-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lints the agent context (AGENTS.md and anything else an agent is
  # given) for malformed structure, smuggled instructions and the like.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.22.0
    hooks:
      - id: skillsaw
