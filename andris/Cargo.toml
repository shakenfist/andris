[package]
name = "andris"
description = "A SPICE server that exports an existing X11 desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# For O_NONBLOCK; already in the tree through tokio.
libc = "0.2"
# 0.8, the version shakenfist-spice-protocol uses, so that only one rand
# is built.
rand = "0.8"
# 2.6, the version rsa and rustls already pull in.
subtle = "2.6"
tokio = { version = "1", features = ["full"] }
# 0.26, the version shakenfist-spice-protocol uses, so that only one
# rustls is built.
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.13", features = ["xtest", "xfixes", "xkb"] }

# ryll's shared crates, pinned to ryll's develop at 502199e (2026-10-11).
# Both crates come from one ryll workspace, so they must always carry the
# same rev, here and in [dev-dependencies]; move them together.
shakenfist-spice-protocol = { version = "0.1.7", git = "https://github.com/shakenfist/ryll", rev = "502199e9b87789b2dd45cb9c13a8b6709e5ab7f8" }
# Only the encoders. openh264 is still built, because the crate depends on
# it unconditionally (ryll#499).
shakenfist-spice-compression = { version = "0.1.7", git = "https://github.com/shakenfist/ryll", rev = "502199e9b87789b2dd45cb9c13a8b6709e5ab7f8", default-features = false, features = [
    "encode",
] }

[dev-dependencies]
rcgen = "0.14"
# The LZ4 decoder too, so tests can decode what the encoder produced.
# Cargo unifies these features with the ones above in test builds.
shakenfist-spice-compression = { version = "0.1.7", git = "https://github.com/shakenfist/ryll", rev = "502199e9b87789b2dd45cb9c13a8b6709e5ab7f8", default-features = false, features = [
    "encode",
    "lz4",
] }
tempfile = "3"
