name: CI

# Runs every pre-commit hook, so skillsaw and the secret scanner gate
# pull requests even for a clone that never ran `pre-commit install`.
# Phase 1 adds the build and test jobs.
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # A venv because the runners enforce PEP 668.
      - name: Install pre-commit
        run: |
          python3 -m venv /tmp/venv-lint
          /tmp/venv-lint/bin/pip install --quiet --disable-pip-version-check \
              pre-commit

      - name: Run pre-commit hooks
        run: |
          /tmp/venv-lint/bin/pre-commit run --all-files \
              --show-diff-on-failure

      - name: Clean up
        if: always()
        run: rm -rf /tmp/venv-lint
